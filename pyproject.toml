[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone-forensics"
version = "4.0.0"
description = "Hardware-first iPhone diagnostics, integrity assessment, and buyer/repair inspection toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "iPhone Forensics contributors"}]
dependencies = []

[project.optional-dependencies]
pymobiledevice3 = ["pymobiledevice3>=7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
# One binary. The former second entry point, `iphone-surgery`, was retired: every
# command it offered is accepted by `iphone-forensics`, and keeping two names for
# one tool only invited the two to drift apart.
iphone-forensics = "iphone_forensics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
